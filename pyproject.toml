[project]
name = "thingsync"
version = "0.1.0"
description = "One-way mirror from Things 3 to Apple Reminders"
requires-python = ">=3.12"
dependencies = [
    "things.py>=0.0.15",
    "pyobjc-framework-EventKit>=10.3; sys_platform == 'darwin'",
]

[project.scripts]
thingsync = "thingsync.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thingsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: touches the real Things database or Reminders store (deselected by default)",
]
addopts = "-m 'not live'"
